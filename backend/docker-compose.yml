services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lestari_esg
      POSTGRES_USER: lestari
      POSTGRES_PASSWORD: lestari
    ports:
      - "5433:5432"
    volumes:
      - lestari_esg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lestari -d lestari_esg"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-real-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lestari_esg_data:

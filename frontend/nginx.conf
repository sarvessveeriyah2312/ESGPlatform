server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # HashRouter means every client-side route is "/#/..." — the server only ever sees "/",
    # so this fallback exists purely as a safety net for direct asset requests, not for routing.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API access — matches VITE_API_BASE_URL="" baked into the build (see ../frontend/Dockerfile).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# On-premise deployment bundle
#
# Packaging only: builds the same backend/ and frontend/ source as the SaaS deployment, plus an
# nginx container serving the built frontend and reverse-proxying /api to the backend. Run from
# this directory:
#
#   cp .env.example .env   # fill in real values
#   docker compose -f docker-compose.onprem.yml up -d --build
#
# See RUNBOOK.md for install, backup/restore, and upgrade procedures.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-esgeasy_esg}"
      POSTGRES_USER: "${DB_USERNAME:-esgeasy}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
    volumes:
      - esgeasy_onprem_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-esgeasy} -d ${DB_NAME:-esgeasy_esg}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: "${DB_NAME:-esgeasy_esg}"
      DB_USERNAME: "${DB_USERNAME:-esgeasy}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env, e.g. via openssl rand -base64 48}"
      CORS_ALLOWED_ORIGINS: "${APP_BASE_URL:?set APP_BASE_URL in .env}"
      APP_BASE_URL: "${APP_BASE_URL:?set APP_BASE_URL in .env}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@example.com}"
      UPLOADS_DIR: /data/uploads
    volumes:
      - esgeasy_onprem_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  esgeasy_onprem_db:
  esgeasy_onprem_uploads:
